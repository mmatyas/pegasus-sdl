name: Build - X11

on: [push, workflow_dispatch]

env:
  SDL_NAME: SDL2-2.32.10
  PLATFORM_SUFFIX: x11-jammy


jobs:
  x11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: ./tools/common_build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sdl2-x11-static
          path: deploy/*.tar.xz
